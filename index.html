<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ring AR Test</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: targets.mind; maxTrack: 6;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets></a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 0: bug -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-box position="0 0.2 0" width="0.2" height="0.2" depth="0.2" color="red"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-box>
    </a-entity>

    <!-- 1: cat -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-box position="0 0.2 0" width="0.2" height="0.2" depth="0.2" color="orange"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-box>
    </a-entity>

    <!-- 2: cherry -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-box position="0 0.2 0" width="0.2" height="0.2" depth="0.2" color="yellow"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-box>
    </a-entity>

    <!-- 3: snail -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-box position="0 0.2 0" width="0.2" height="0.2" depth="0.2" color="green"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-box>
    </a-entity>

    <!-- 4: star -->
    <a-entity mindar-image-target="targetIndex: 4">
      <a-box position="0 0.2 0" width="0.2" height="0.2" depth="0.2" color="blue"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-box>
    </a-entity>

    <!-- 5: yellowalien -->
    <a-entity mindar-image-target="targetIndex: 5">
      <a-box position="0 0.2 0" width="0.2" height="0.2" depth="0.2" color="purple"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-box>
    </a-entity>

  </a-scene>
</body>
</html>
